# Re-ejecuta las queries de gráficos del dashboard después de la cadena de matviews
# (vivas 05:00, unión 08:00, métricas 09:00, validación 10:00 UTC). Hace falta porque la ejecución
# de una matview deja en su query origen solo {"rows": N}; ver docs/runbook.md.
# Requiere el secret DUNE_API_KEY en el repo. Costo medido: ~0,5 cr por corrida.
name: refresh-charts
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/deploy_pilot.py refresh-charts
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
